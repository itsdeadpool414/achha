<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060608">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>VibeHai — Yaar, Vibe Hai ⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--v:#7B2FFF;--p:#FF3CAC;--c:#00F0FF;--g:#00FF87;--gold:#FFD700;--bg:#060608;--card:#0d0d16;--el:#111120;--bd:rgba(255,255,255,.08);--t2:#9a9aa8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:#fff;font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 100px;min-height:100vh}
.logo{font-family:'Bebas Neue';font-size:28px;letter-spacing:4px;background:linear-gradient(90deg,var(--v),var(--p));-webkit-background-clip:text;color:transparent}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 0 16px}
.pill{font-family:'Space Mono';font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:4px 10px;border-radius:20px;border:1px solid var(--bd);color:var(--t2);display:inline-block}
.pill.v{border-color:var(--v);color:#b38cff;background:rgba(123,47,255,.12)}
.pill.g{border-color:var(--g);color:var(--g);background:rgba(0,255,135,.08)}
.pill.gold{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08)}
.pill.c{border-color:var(--c);color:var(--c)}
.pill.r{border-color:#ff5a5a;color:#ff7a7a}
h1{font-family:'Bebas Neue';font-size:44px;letter-spacing:2px;line-height:1}
h2{font-family:'Bebas Neue';font-size:28px;letter-spacing:2px;margin:24px 0 10px}
.mut{color:var(--t2)}
.sm{font-size:12px}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.tier{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column}.tier h2{font-size:17px;margin:8px 0 2px}.tier .price{font:700 24px 'Space Mono';margin:4px 0 8px}.tier ul{list-style:none;padding:0;margin:0 0 6px;font-size:12.5px;color:var(--t2);flex:1}.tier li{margin:4px 0}.tier li:before{content:'✓ ';color:var(--g)}.tier.pop{border-color:var(--g);box-shadow:0 0 30px rgba(0,255,135,.18)}.tier.vip{border-color:var(--gold)}.tier.vip .price{color:var(--gold)}.tier .btn{height:44px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.card.glow{border-color:var(--v);box-shadow:0 0 40px rgba(123,47,255,.25)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:12px;border:0;font:700 15px 'DM Sans';letter-spacing:.5px;background:var(--v);color:#fff;cursor:pointer;margin-top:10px}
.btn.ghost{background:rgba(255,255,255,.06);color:#fff}
.btn.line{background:transparent;border:1px solid var(--v);color:#c9a8ff}
.btn.g{background:var(--g);color:#000}
.btn.sm{height:38px;font-size:13px;width:auto;padding:0 14px;margin:4px 4px 0 0;display:inline-flex}
.btn:disabled{opacity:.4}
input,textarea,select{width:100%;background:var(--el);border:1px solid var(--bd);border-radius:12px;color:#fff;font:15px 'DM Sans';padding:13px;margin-top:6px}
label{display:block;margin-top:12px;font-size:13px;color:var(--t2)}
.row{display:flex;gap:10px}.row>*{flex:1}
.big{font-family:'Bebas Neue';font-size:52px;letter-spacing:2px;line-height:1}
.stat{background:var(--el);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Bebas Neue';font-size:30px;letter-spacing:1px}
.stat span{font-family:'Space Mono';font-size:10px;letter-spacing:1px;color:var(--t2);text-transform:uppercase}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(6,6,8,.92);backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--t2);font-family:'Space Mono';letter-spacing:1px;min-width:60px}
.nav a i{font-style:normal;font-size:22px}
.nav a.on{color:#c9a8ff}
.nav a.rec i{background:var(--v);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 0 24px rgba(123,47,255,.6)}
.feed{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;background:#000;z-index:5}
.slide{height:100vh;height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center}
.slide video{width:100%;height:100%;object-fit:cover}
.ov{position:absolute;left:0;right:0;bottom:0;padding:20px 16px calc(90px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85))}
.hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#1b1b2b;border:1px solid var(--bd);padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:90%;text-align:center}
.reelrow{display:flex;gap:12px;align-items:flex-start}
.reelrow video{width:96px;height:170px;object-fit:cover;border-radius:10px;background:#000;flex:none}
.qr{background:#fff;border-radius:16px;padding:14px;display:inline-block}
.qr img{display:block;width:100%;height:auto}
.center{text-align:center}
.step{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--t2)}
.step.ok{color:var(--g)}.step.bad{color:#ff7a7a}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px}
.check input{width:22px;height:22px;margin:0;flex:none}
.prog{height:6px;background:var(--el);border-radius:6px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--p))}
.movie{position:fixed;inset:0;background:#000;z-index:30;display:flex;align-items:center;justify-content:center}
.movie video{width:100%;height:100%;object-fit:contain}
.side{position:absolute;right:10px;bottom:calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;z-index:6;align-items:center}
.side button{background:rgba(0,0,0,.45);border:0;color:#fff;width:52px;border-radius:26px;padding:8px 0;font:700 12px 'DM Sans';display:flex;flex-direction:column;align-items:center;cursor:pointer}
.side button i{font-style:normal;font-size:24px;line-height:1.1}
.ann{border-left:3px solid var(--p);padding:8px 12px;background:var(--el);border-radius:0 10px 10px 0;margin-top:8px}
.ann .mut{font-size:11px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;background:var(--card);border-top:1px solid var(--bd);border-radius:20px 20px 0 0;z-index:40;display:flex;flex-direction:column;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.sheet .cl{overflow-y:auto;flex:1;margin:8px 0}
.sheet .cm{padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39}
.fbtn{background:transparent;border:1px solid #fff;color:#fff;border-radius:8px;padding:2px 10px;font:700 12px 'DM Sans';margin-left:8px;cursor:pointer}
.fbtn.on{border-color:var(--bd);color:var(--t2)}
.tabs{display:flex;gap:6px}.tabs a{font-family:'Space Mono';font-size:11px;letter-spacing:1px;padding:5px 10px;border-radius:16px;background:rgba(0,0,0,.5);color:var(--t2)}.tabs a.on{color:#fff;border:1px solid #fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:12px}.grid a{position:relative;aspect-ratio:9/16;background:#000;border-radius:8px;overflow:hidden}.grid video{width:100%;height:100%;object-fit:cover}.grid span{position:absolute;left:4px;bottom:4px;font-size:11px;text-shadow:0 1px 3px #000}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000;padding:24px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL = 'https://npprahzhjjujhyxznmbq.supabase.co';
const SB_KEY = 'sb_publishable_i6vk6IQByH16Pj1YlSE9aA_5UrkK0NK';
const sb = createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });
const BUCKET = 'vibehai-media';
const BASE = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pub = p => sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;
const SCORE_TXT = 'Score = Views × 1 + Likes × 2 + Shares × 5 + 50 bonus if picked';
const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 6e4); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; };
const annHtml = list => list.map(a => `<div class="ann"><div>${esc(a.body)}</div><div class="mut">Organiser · ${ago(a.at)}</div></div>`).join('');
const orgBadge = e => e.org_name ? `<span class="pill g">✅ ${esc(e.org_name)}</span>` : '<span class="pill g">✅ VERIFIED EVENT</span>';
const distKm = (a, b, c, d) => { const R = 6371, x = (c - a) * Math.PI / 180, y = (d - b) * Math.PI / 180, h = Math.sin(x / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const orgLink = n => `#/o/${encodeURIComponent(n)}`;
const fmtD = d => new Date(d).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
function toast(m, ms = 2600) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

// ---------- device identity (no app, no login) ----------
function uuid() { return crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); }
let DEV = JSON.parse(localStorage.getItem('vh_dev') || 'null');
if (!DEV) { const b = new Uint8Array(24); crypto.getRandomValues(b); DEV = { id: uuid(), secret: Array.from(b, x => x.toString(16).padStart(2, '0')).join('') }; localStorage.setItem('vh_dev', JSON.stringify(DEV)); }
const A = () => ({ p_device: DEV.id, p_secret: DEV.secret });
async function rpc(fn, args = {}, auth = true) {
  const { data, error } = await sb.rpc(fn, auth ? { ...A(), ...args } : args);
  if (error) throw new Error(error.message);
  return data;
}
const ready = rpc('vh_register').catch(e => toast('Network issue: ' + e.message));
let ME = null;
async function me() { await ready; ME = await rpc('vh_me'); return ME; }

// ---------- routing ----------
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { parts, q: new URLSearchParams(qs || '') };
}
let cleanup = [];
function onLeave(fn) { cleanup.push(fn); }
window.addEventListener('hashchange', render);
const nav = (on) => `<nav class="nav">
  <a href="#/" class="${on==='home'?'on':''}"><i>🏠</i>HOME</a>
  <a href="#/feed" class="${on==='feed'?'on':''}"><i>▶️</i>FEED</a>
  <a href="#/post" class="rec ${on==='post'?'on':''}"><i>🎬</i>POST</a>
  <a href="#/me" class="${on==='me'?'on':''}"><i>💸</i>WALLET</a>
</nav>`;

async function render() {
  cleanup.forEach(f => { try { f() } catch (e) {} }); cleanup = [];
  window.scrollTo(0, 0);
  const { parts, q } = route();
  try {
    if (!parts.length) return await home();
    switch (parts[0]) {
      case 'e': return await eventEntry(parts[1], q.get('c'));
      case 'feed': return await feed(q.get('e'), q.get('f') === '1');
      case 'post': return await post(parts[1]);
      case 'me': return await wallet();
      case 'movie': return await movie(parts[1]);
      case 'admin': return await admin(parts[1]);
      case 'screen': return await screen(parts[1]);
      case 'gate': location.hash = '#/'; return;
      case 'host': location.hash = '#/org?s=1'; return;
      case 'org': return await orgPortal(parts[1], q);
      case 'score': return await scorePage();
      case 'u': return await profile(parts[1]);
      case 'o': return await orgPage(decodeURIComponent(parts[1] || ''));
      default: return await home();
    }
  } catch (e) { app.innerHTML = `<div class="wrap"><div class="top"><a href="#/" class="logo">⚡ VIBEHAI</a></div><div class="card">Something went wrong: ${esc(e.message)}</div><button class="btn" onclick="location.reload()">Reload</button></div>`; }
}

// ---------- home ----------
async function home() {
  app.innerHTML = `<div class="wrap"><div class="top"><span class="logo">⚡ VIBEHAI</span><span class="pill v">BETA</span></div><p class="mut">Loading…</p></div>${nav('home')}`;
  await ready;
  const [events, m] = await Promise.all([rpc('vh_events_list', {}, false), me()]);
  const now = Date.now();
  let here = null;
  try { const perm = await navigator.permissions?.query({ name: 'geolocation' }); if (perm?.state === 'granted') here = await getPos(); } catch (e) {}
  if (here) { events.forEach(e => e.km = distKm(here.latitude, here.longitude, e.lat, e.lng)); }
  const live = events.filter(e => new Date(e.ends_at) > now);
  if (here) live.sort((a, b) => a.km - b.km);
  const past = events.filter(e => new Date(e.ends_at) <= now);
  const card = e => `<div class="card"><div class="row" style="align-items:center"><div><b>${esc(e.name)}</b><div class="mut sm">${esc(e.venue || '')} · ${fmtD(e.starts_at)}</div>${e.org_name ? `<a class="sm" style="color:var(--g)" href="${orgLink(e.org_name)}">✅ by ${esc(e.org_name)}</a>` : ''}${e.km != null ? `<div class="sm" style="color:var(--c)">📍 ${e.km < 1 ? Math.round(e.km * 1000) + ' m' : e.km.toFixed(1) + ' km'} away</div>` : ''}</div>
    <div style="flex:none">${new Date(e.ends_at) > now ? (new Date(e.starts_at) <= now ? '<span class="pill r">● LIVE</span>' : '<span class="pill">SOON</span>') : '<span class="pill">ENDED</span>'}</div></div>
    <div><a class="btn sm ghost" href="#/feed?e=${e.slug}">▶ ${e.reel_count} reels</a>${new Date(e.ends_at) <= now ? `<a class="btn sm line" href="#/movie/${e.slug}">🎬 Aftermovie</a>` : ''}</div></div>`;
  app.innerHTML = `<div class="wrap">
    <div class="top"><span class="logo">⚡ VIBEHAI</span><span><a href="#/org" class="pill v">🎪 ORGANISER</a> <a href="#/me" class="pill gold">⏱ ${m.minutes} MIN</a></span></div>
    <h1>Film the moment.<br>Get paid for it.</h1>
    <p class="mut" style="margin-top:10px">Scan the VibeHai QR at the venue, post your reel, and the best ones get reposted on our Instagram and paid. Watch reels to earn Vibe Minutes.</p>
    <div class="card glow"><div class="row center">
      <div><div class="big">📲</div><div class="sm mut">Scan QR at venue</div></div>
      <div><div class="big">🎬</div><div class="sm mut">Post your reel</div></div>
      <div><div class="big">💸</div><div class="sm mut">Get picked, get paid</div></div></div></div>
    ${m.checkins.filter(c => new Date(c.ends_at).getTime() + 864e5 > now).map(c => `<a class="btn" href="#/post/${c.slug}">🎬 Post a reel from ${esc(c.name)}</a>`).join('')}
    <div class="row" style="align-items:center"><h2>${here ? 'Events near you' : 'Events'}</h2>${here ? '' : '<button class="btn sm ghost" id="near" style="flex:none">📍 Near me</button>'}</div>
    ${live.map(card).join('') || '<p class="mut">No live events right now.</p>'}
    ${past.length ? '<h2>Past events</h2>' + past.map(card).join('') : ''}
    <div class="card"><b>Running a fest or event?</b><p class="mut sm" style="margin-top:4px">Get your event on VibeHai. We verify organisers before the QR goes live.</p><a class="btn sm line" href="#/org?s=1">🎪 Organiser sign-up</a><a class="btn sm ghost" href="#/org">Organiser login</a><a class="btn sm ghost" href="#/score">How picks work</a></div>
    <a class="card" href="https://www.instagram.com/originalvibehai/" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">📸 Follow <b>@originalvibehai</b> on Instagram for picks, drops and fest updates</a>
    <p class="mut sm center" style="margin-top:30px">100% fan-filmed · location-verified · Yaar, Vibe Hai ⚡</p>
  </div>${nav('home')}`;
  const nb = $('#near'); if (nb) nb.onclick = async () => { nb.disabled = true; try { await getPos(); home(); } catch (e) { toast(e.message); nb.disabled = false; } };
}

// ---------- event entry + verification ----------
function getPos() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Location not supported on this browser'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords), e => rej(new Error(e.code === 1 ? 'Location permission denied. Allow location for this site in Settings → Safari → Location.' : 'Could not get your location. Try again outdoors or near a window.')), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
async function eventEntry(slug, code) {
  await ready;
  const ev = await rpc('vh_event', { p_slug: slug }, false);
  if (!ev) { app.innerHTML = `<div class="wrap"><div class="top"><a href="#/" class="logo">⚡ VIBEHAI</a></div><div class="card">This QR is invalid or the event was removed.</div></div>${nav('')}`; return; }
  const m = await me();
  const already = m.checkins.some(c => c.slug === slug);
  app.innerHTML = `<div class="wrap">
    <div class="top"><a href="#/" class="logo">⚡ VIBEHAI</a>${ev.org_name ? `<a href="${orgLink(ev.org_name)}">${orgBadge(ev)}</a>` : orgBadge(ev)}</div>
    <div class="card glow center" style="padding:28px 16px">
      <h1>${esc(ev.name)}</h1>
      <p class="mut" style="margin-top:6px">${esc(ev.venue || '')} · ${fmtD(ev.starts_at)}</p>
    </div>
    <div id="anns"></div>
    <div id="vipx"></div>
    <div id="vbox">${already ? `<div class="card"><div class="step ok">✅ You're verified at this event</div></div><a class="btn" href="#/post/${slug}">🎬 Post your reel →</a>` : `
      <div class="card">
        <b>Prove you're here</b>
        <p class="mut sm" style="margin-top:4px">We check that you're at the venue during the event. Your location is used only for this check.</p>
        <div id="steps"></div>
        <label class="check"><input type="checkbox" id="agree"> <span>I'm 18+ (or have a parent's OK), and I agree VibeHai may show my reels in the app, repost them on its Instagram with credit to me, and use them in the event aftermovie.</span></label>
      </div>
      <button class="btn" id="go">📍 Verify &amp; enter creator mode</button>`}
    </div>
    <a class="btn ghost" href="#/feed?e=${slug}">Just browse reels →</a>
    <p class="center" style="margin-top:14px"><a href="https://www.instagram.com/originalvibehai/" target="_blank" rel="noopener" class="pill v">📸 Picked reels go up on @originalvibehai</a></p>
    <p class="mut sm center" style="margin-top:16px">No app download needed · Works in your browser</p>
  </div>${nav('')}`;
  const loadAnn = async () => { try { const l = await rpc('vh_announcements', { p_slug: slug }, false); const el = $('#anns'); if (el) el.innerHTML = l.length ? `<div class="card"><b>📢 Live updates</b>${annHtml(l.slice(0, 5))}</div>` : ''; } catch (e) {} };
  loadAnn(); const annT = setInterval(loadAnn, 30000); onLeave(() => clearInterval(annT));
  (async () => {
    try {
      const v = await rpc('vh_event_vip', { p_slug: slug }, false); if (!v) return;
      const vs = await rpc('vh_vip_status', { p_slug: slug, p_kind: 'pass' }).catch(() => ({}));
      const full = v.limited && v.capacity && v.requests >= v.capacity && !vs.requested;
      const badge = v.invite_only ? '🔒 Invite-only' : v.limited ? '⏳ Limited' : '👑 Premium';
      $('#vipx').innerHTML = `<div class="tiers">
        <div class="tier pop"><span class="pill g">⭐ Most fans</span><h2>Regular entry</h2><div class="price">Free</div>
          <ul><li>Scan the venue QR</li><li>Post reels, get picked &amp; paid</li><li>Aftermovie for ₹18 or 18 Vibe Minutes</li></ul></div>
        <div class="tier vip"><span class="pill gold">${badge}</span><h2>👑 VIP · ${esc(v.zone)}</h2><div class="price">${inr(v.price)}</div>
          <ul>${vipPerks(v).map(x => `<li>${x}</li>`).join('') || '<li>VIP zone access</li>'}${v.limited && v.capacity ? `<li>Only ${v.capacity} spots</li>` : ''}</ul>
          <button class="btn line" id="vreq" ${vs.requested || full ? 'disabled' : ''}>${vs.requested ? '✓ Requested' : full ? 'VIP full' : v.invite_only ? 'Request an invite' : 'Request VIP · soon'}</button></div></div>

function videoDuration(file) {
  return new Promise(res => { const v = document.createElement('video'); v.preload = 'metadata'; v.onloadedmetadata = () => { res(v.duration); URL.revokeObjectURL(v.src); }; v.onerror = () => res(0); v.src = URL.createObjectURL(file); });
}
async function post(slug) {
  const m = await me();
  const open = m.checkins.filter(c => new Date(c.ends_at).getTime() + 864e5 > Date.now());
  if (!slug && open.length === 1) slug = open[0].slug;
  if (!slug) {
    app.innerHTML = `<div class="wrap"><div class="top"><a href="#/" class="logo">⚡ VIBEHAI</a></div><h1>Post a reel</h1>
      ${open.length ? '<p class="mut" style="margin:10px 0">Pick the event:</p>' + open.map(c => `<a class="btn line" href="#/post/${c.slug}">${esc(c.name)}</a>`).join('') :
      `<div class="card"><b>Scan first 📲</b><p class="mut" style="margin-top:6px">Only fans who are really at the event can post. Scan the VibeHai QR on the venue screen to unlock posting.</p></div>`}
    </div>${nav('post')}`; return;
  }
  if (!open.some(c => c.slug === slug)) { location.hash = '#/post'; return; }
  const ev = open.find(c => c.slug === slug);
  const evVip = await rpc('vh_event_vip', { p_slug: slug }, false).catch(() => null);
  app.innerHTML = `<div class="wrap"><div class="top"><a href="#/" class="logo">⚡ VIBEHAI</a><span class="pill g">✅ VERIFIED</span></div>
    <h1>Post from<br>${esc(ev.name)}</h1>
    <div class="row" style="margin-top:14px">
      <label class="btn" style="margin:0">🎥 Record<input type="file" accept="video/*" capture="environment" id="rec" hidden></label>
      <label class="btn ghost" style="margin:0">📁 Upload<input type="file" accept="video/*" id="up" hidden></label>
    </div>
    <p class="mut sm" style="margin-top:8px">Up to 60 seconds and 50 MB. Vertical looks best.</p>
    <div id="prev"></div>
  </div>${nav('post')}`;
  let file = null, source = 'recorded';
  const pick = async (f, s) => {
    if (!f) return;
    if (f.size > 50 * 1024 * 1024) return toast('That video is over 50 MB. Trim it and try again.');
    const d = await videoDuration(f);
    if (d > 61) return toast(`That's ${Math.round(d)} s. Keep it under 60 seconds.`);
    file = f; source = s;
    $('#prev').innerHTML = `<div class="card"><video src="${URL.createObjectURL(f)}" playsinline controls loop style="width:100%;max-height:60vh;border-radius:12px;background:#000"></video>
      <label>Caption</label><textarea id="cap" maxlength="200" rows="2" placeholder="Describe this moment…"></textarea>
      <label class="check"><input type="checkbox" id="real"> <span>This is real footage I filmed at this event. No AI edits.</span></label>
      ${evVip ? `<label class="check"><input type="checkbox" id="vipz"> <span>👑 Filmed in the VIP zone (${esc(evVip.zone)}). The organiser checks this.</span></label>` : ''}
      <button class="btn" id="send">Submit for review →</button><div id="pg"></div></div>`;
    $('#send').onclick = submit;
  };
  $('#rec').onchange = e => pick(e.target.files[0], 'recorded');
  $('#up').onchange = e => pick(e.target.files[0], 'uploaded');
  async function submit() {
    if (!$('#real').checked) return toast('Confirm the footage is real to submit');
    const b = $('#send'); b.disabled = true; b.textContent = 'Checking you’re still at the venue…';
    let c;
    try {
      c = await getPos();
      const chk = await rpc('vh_checkin', { p_slug: slug, p_lat: c.latitude, p_lng: c.longitude, p_accuracy: c.accuracy, p_code: '' });
      if (!chk.ok) throw new Error(chk.reason);
    } catch (e) { toast(e.message); b.disabled = false; b.textContent = 'Submit for review →'; return; }
    b.textContent = 'Uploading…';
    $('#pg').innerHTML = '<div class="prog"><i style="width:30%"></i></div>';
    try {
      const ext = (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
      const path = `reels/${DEV.id}/${Date.now()}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type || 'video/mp4', upsert: false });
      if (error) throw error;
      $('#pg').innerHTML = '<div class="prog"><i style="width:85%"></i></div>';
      const sr = await rpc('vh_submit_reel', { p_slug: slug, p_path: path, p_caption: $('#cap').value, p_source: source, p_real: true, p_lat: c.latitude, p_lng: c.longitude, p_accuracy: c.accuracy });
      if ($('#vipz')?.checked && sr?.id) await rpc('vh_tag_reel_vip', { p_reel: sr.id, p_on: true }).catch(() => {});
      app.querySelector('.wrap').innerHTML = `<div class="top"><a href="#/" class="logo">⚡ VIBEHAI</a></div>
        <div class="card glow center" style="padding:30px 16px"><div class="big">⏳</div><h2 style="margin-top:6px">Under review</h2>
        <div class="step ok" style="justify-content:center">✅ Location verified at the venue</div>
        <div class="step" style="justify-content:center">⏳ Team review — usually a few hours</div>
        <p class="mut sm">If your reel is picked, we repost it on @originalvibehai with credit and you get paid to your UPI.</p></div>
        <a class="btn" href="#/me">Add your UPI + Instagram →</a><a class="btn ghost" href="#/post/${slug}">Post another</a><a class="btn ghost" href="#/feed">Watch reels &amp; earn minutes</a>`;
    } catch (e) { toast('Upload failed: ' + e.message, 4000); b.disabled = false; b.textContent = 'Try again'; }
  }
}

      <video src="${pub(r.video_path)}" playsinline loop muted preload="metadata"></video>
      <div class="side"><button class="lk"><i>${r.liked ? '❤️' : '🤍'}</i><span>${r.likes}</span></button><button class="cmb"><i>💬</i><span>${r.comments}</span></button><button class="sh"><i>📤</i><span>${r.shares}</span></button><button class="sc" onclick="location.hash='#/score'"><i>⚡</i><span>${r.score}</span></button></div>

        <div style="margin-top:8px;font-weight:700"><a href="#/u/${r.pid}">@${esc(r.creator)}</a>${r.is_me ? '' : `<button class="fbtn ${r.follows ? 'on' : ''}" data-pid="${r.pid}">${r.follows ? 'Following' : '+ Follow'}</button>`}</div>
        <div class="sm">${esc(r.caption || '')}</div>
        <div class="mut sm">${esc(r.event)}${r.venue ? ' · ' + esc(r.venue) : ''} · ${r.views} views</div></div></div>`).join('')}</div>
    <div class="hud"><a href="#/" class="logo" style="font-size:22px">⚡ VIBEHAI</a>${tabsH}<span><button class="pill" id="snd" style="background:rgba(0,0,0,.5)">🔇 TAP FOR SOUND</button> <a href="#/me" class="pill gold" id="mn" style="background:rgba(0,0,0,.5)">⏱ ${mins} MIN</a></span></div>${nav('feed')}`;
  document.querySelectorAll('.slide').forEach(sl => {
    const id = sl.dataset.id, it = items.find(x => x.id === id);
    sl.querySelector('.lk').onclick = async e => { const b = e.currentTarget; try { const r = await rpc('vh_like', { p_reel: id }); b.innerHTML = `<i>${r.liked ? '❤️' : '🤍'}</i><span>${r.likes}</span>`; } catch (er) { toast(er.message); } };
    sl.querySelector('.cmb').onclick = e => openComments(id, e.currentTarget);
    sl.querySelector('.fbtn')?.addEventListener('click', async e => {
      const pid = e.currentTarget.dataset.pid;
      try { const r = await rpc('vh_follow', { p_kind: 'creator', p_target: pid });
        document.querySelectorAll(`.fbtn[data-pid="${pid}"]`).forEach(b => { b.className = 'fbtn' + (r.following ? ' on' : ''); b.textContent = r.following ? 'Following' : '+ Follow'; });
        toast(r.following ? 'Following ✅' : 'Unfollowed', 1200); } catch (er) { toast(er.message); }
    });
    sl.querySelector('.sh').onclick = async e => {
      const b = e.currentTarget, url = `${BASE}#/feed?e=${it.slug}`;
      const text = `🔥 @${it.creator} at ${it.event} on VibeHai`;
      try { if (navigator.share) await navigator.share({ title: 'VibeHai', text, url }); else { await navigator.clipboard.writeText(text + ' ' + url); toast('Link copied'); } }
      catch (er) { if (er.name === 'AbortError') return; }
      try { const r = await rpc('vh_share', { p_reel: id }); b.innerHTML = `<i>📤</i><span>${r.shares}</span>`; } catch (er) {}
    };
  });
  let muted = true;
  const vids = [...document.querySelectorAll('.slide video')];
  $('#snd').onclick = () => { muted = !muted; vids.forEach(v => v.muted = muted); $('#snd').textContent = muted ? '🔇 TAP FOR SOUND' : '🔊 SOUND ON'; };
  let cur = null, acc = 0, last = performance.now(), sentFor = {};
  const io = new IntersectionObserver(es => es.forEach(e => {
    const v = e.target.querySelector('video');
    if (e.isIntersecting && e.intersectionRatio > .6) { cur = e.target.dataset.id; v.muted = muted; v.play().catch(() => {}); }
    else { v.pause(); }
  }), { threshold: [0, .6, 1] });
  document.querySelectorAll('.slide').forEach(s => io.observe(s));
  const tick = setInterval(async () => {
    const now = performance.now(); const dt = (now - last) / 1000; last = now;
    const v = vids.find(x => x.closest('.slide').dataset.id === cur);
    if (document.visibilityState === 'visible' && v && !v.paused) acc += dt;
    if (acc >= 10 && cur) {
      const s = Math.floor(acc); acc -= s;
      try { const r = await rpc('vh_watch', { p_reel: cur, p_seconds: s, p_view: !sentFor[cur] }); sentFor[cur] = true;
        if (r.minutes > mins) { mins = r.minutes; const el = $('#mn'); if (el) el.textContent = `⏱ ${mins} MIN`; toast('+1 Vibe Minute ⏱', 1400); } } catch (e) {}
    }
  }, 1000);
  onLeave(() => { clearInterval(tick); io.disconnect(); });
}

async function openComments(reel, btn) {
  const shade = document.createElement('div'); shade.className = 'shade';
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="row" style="align-items:center"><b>💬 Comments</b><button class="btn sm ghost x" style="flex:none">✕</button></div><div class="cl"><p class="mut sm">Loading…</p></div>
    <div class="row" style="align-items:center"><input class="ci" maxlength="300" placeholder="Add a comment…" style="margin:0"><button class="btn sm go" style="flex:none;margin:0 0 0 6px">Post</button></div>`;
  document.body.append(shade, sh);
  const close = () => { shade.remove(); sh.remove(); };
  shade.onclick = close; sh.querySelector('.x').onclick = close; onLeave(close);
  const load = async () => {
    const l = await rpc('vh_comments_list', { p_reel: reel });
    sh.querySelector('.cl').innerHTML = l.map(c => `<div class="cm" data-id="${c.id}"><a href="#/u/${c.pid}"><b>@${esc(c.who)}</b></a> ${esc(c.body)}<div class="mut sm">${ago(c.at)}${c.mine ? ' · <a href="#" class="dc" style="color:#ff7a7a">delete</a>' : ''}</div></div>`).join('') || '<p class="mut sm">No comments yet. Be the first.</p>';
    sh.querySelectorAll('.dc').forEach(a => a.onclick = async ev => { ev.preventDefault(); try { await rpc('vh_delete_comment', { p_id: a.closest('.cm').dataset.id }); load(); } catch (e) { toast(e.message); } });
    const cl = sh.querySelector('.cl'); cl.scrollTop = cl.scrollHeight;
    if (btn) btn.querySelector('span').textContent = l.length;
  };
  sh.querySelector('.go').onclick = async () => { const i = sh.querySelector('.ci'), v = i.value.trim(); if (!v) return; try { await rpc('vh_comment', { p_reel: reel, p_body: v }); i.value = ''; load(); } catch (e) { toast(e.message); } };
  load().catch(e => toast(e.message));
}

      <div style="margin-top:12px"><a class="btn sm ${signup ? 'ghost' : ''}" href="#/org">Log in</a><a class="btn sm ${signup ? '' : 'ghost'}" href="#/org?s=1">Create account</a></div>
      ${signup ? `<div class="card"><b>Register your organisation</b><p class="mut sm">VibeHai checks every organiser before events go public, usually within 24 hours.</p>
        <label>Organisation / club / college</label><input id="o1" placeholder="SVN College Cultural Committee">
        <label>Your name</label><input id="o2" placeholder="Event head or coordinator">
        <label>Official email</label><input id="o3" type="email" inputmode="email" placeholder="culture@college.ac.in">
        <label>Phone</label><input id="o4" type="tel" inputmode="tel" placeholder="98xxxxxxxx">
        <label>Proof link</label><input id="o5" placeholder="Instagram page, website or permission letter link">
        <label>Login ID</label><input id="o6" autocapitalize="none" autocomplete="username" placeholder="svn_culture">
        <label>Password (8+ characters)</label><input id="o7" type="password" autocomplete="new-password">
        <button class="btn" id="go">Create organiser account</button></div>`
      : `<div class="card"><b>Log in</b>
        <input id="l1" placeholder="Login ID" autocapitalize="none" autocomplete="username" style="margin-top:10px">
        <input id="l2" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px">
        <button class="btn" id="go">Log in</button></div>`}</div>${nav('')}`;
    $('#go').onclick = async () => {
      const b = $('#go'); b.disabled = true;
      try {
        if (signup) {
          await rpc('vh_org_signup', { p_org: $('#o1').value, p_contact: $('#o2').value, p_email: $('#o3').value, p_phone: $('#o4').value, p_proof: $('#o5').value, p_login: $('#o6').value, p_pass: $('#o7').value });
          toast('Account created ✅'); location.hash = '#/org';
        } else {
          const r = await rpc('vh_org_login', { p_login: $('#l1').value, p_pass: $('#l2').value });
          if (!r.ok) { toast(r.reason); b.disabled = false; return; }
          toast('Logged in ✅'); orgPortal(tab, q);
        }
      } catch (e) { toast(e.message); b.disabled = false; }
    };
    return;
  }
  const lo = `<span><span class="pill ${h.status === 'approved' ? 'g' : 'gold'}">${h.status === 'approved' ? '✅ VERIFIED' : '⏳ ' + h.status.toUpperCase()}</span> <a href="#" id="lo" class="mut sm" style="margin-left:8px">Log out</a></span>`;
  const bindLo = () => $('#lo').onclick = async ev => { ev.preventDefault(); await rpc('vh_org_logout'); toast('Logged out'); location.hash = '#/org'; orgPortal(); };
  if (h.status !== 'approved') {
    app.innerHTML = `<div class="wrap">${top(lo)}<h1>${esc(h.org_name)}</h1><div class="card center"><div class="big">⏳</div>
      <p>${h.status === 'pending' ? 'VibeHai is checking your proof link. Once you are verified you can create events and moderate reels here.' : 'This account is ' + esc(h.status) + '. Write to VibeHai if you think this is a mistake.'}</p></div></div>${nav('')}`;
    bindLo(); return;
  }
  tab = tab || 'events';
  const t = (k, l) => `<a class="btn sm ${tab === k ? '' : 'ghost'}" href="#/org/${k}">${l}</a>`;
  app.innerHTML = `<div class="wrap">${top(lo)}<h1>${esc(h.org_name)}</h1>
    <div class="row" style="margin-top:10px"><div class="stat"><b>${h.events.length}</b><span>Events</span></div><div class="stat"><b style="color:var(--gold)">${h.pending}</b><span>To review</span></div><div class="stat"><b>${h.followers}</b><span>Followers</span></div></div>
    <div style="margin-top:10px">${t('events', 'Events')}${t('new', '+ New event')}${t('reels', `Moderate reels${h.pending ? ' (' + h.pending + ')' : ''}`)}</div><div id="body"></div></div>${nav('')}`;
  bindLo();
  const body = $('#body');

  if (tab === 'new') {
    const d0 = new Date(); d0.setDate(d0.getDate() + 1); d0.setHours(18, 0, 0, 0);
    body.innerHTML = `<h2>Create an event</h2><div class="card">
      <label>Event name</label><input id="en" placeholder="Harda Garba Night 2026">
      <label>Venue</label><input id="ev" placeholder="Nehru Stadium, Harda">
      <div class="row"><div><label>Starts</label><input id="es" type="datetime-local" value="${locDT(d0)}"></div><div><label>Ends</label><input id="ee" type="datetime-local" value="${locDT(new Date(d0.getTime() + 5 * 36e5))}"></div></div>
      <label>Venue location</label><p class="mut sm">Stand at the venue and tap the button, or paste the coordinates from Google Maps.</p>
      <button class="btn sm ghost" id="here">📍 Use my current location</button>
      <div class="row"><div><label>Latitude</label><input id="la" inputmode="decimal"></div><div><label>Longitude</label><input id="lg" inputmode="decimal"></div></div>
      <div id="map" class="sm"></div>
      <label>Check-in radius (metres)</label><input id="ra" inputmode="numeric" value="500"><p class="mut sm">Fans must be inside this circle to scan in and post. 300–800 m suits most grounds.</p>
      ${vipForm()}
      <button class="btn" id="mk">Create event &amp; get QR</button></div>`;
    const showMap = () => { const la = parseFloat($('#la').value), lg = parseFloat($('#lg').value); $('#map').innerHTML = isNaN(la) || isNaN(lg) ? '' : `<a style="color:#c9a8ff" target="_blank" href="https://www.google.com/maps/search/?api=1&query=${la},${lg}">🗺 Check this spot on Google Maps</a>`; };
    bindVipForm(body.querySelector('.vipf'));
    $('#la').oninput = $('#lg').oninput = showMap;
    $('#here').onclick = async () => { try { const c = await getPos(); $('#la').value = c.latitude.toFixed(6); $('#lg').value = c.longitude.toFixed(6); showMap(); toast(`Got it (±${Math.round(c.accuracy)} m)`); } catch (e) { toast(e.message); } };
    $('#mk').onclick = async () => {
      const vc = readVip(body.querySelector('.vipf'));
      if (vc.enabled && !vc.zone.trim()) return toast('Give the VIP zone a name');
      if (vc.enabled && !(+vc.price > 0)) return toast('Set a VIP price');
      const b = $('#mk'); b.disabled = true;
      try {
        const r = await rpc('vh_org_create_event', { p_name: $('#en').value, p_venue: $('#ev').value, p_lat: parseFloat($('#la').value), p_lng: parseFloat($('#lg').value),
          p_radius: parseInt($('#ra').value) || 500, p_starts: new Date($('#es').value).toISOString(), p_ends: new Date($('#ee').value).toISOString() });
        const vcfg = readVip(body.querySelector('.vipf'));
        if (vcfg.enabled) { try { await rpc('vh_org_set_vip', { p_slug: r.slug, p_cfg: vcfg }); } catch (er) { toast('Event made, but VIP not saved: ' + er.message, 4000); } }
        toast('Event created ✅'); location.hash = `#/screen/${r.slug}`;
      } catch (e) { toast(e.message); b.disabled = false; }
    };
    return;
  }

  if (tab === 'reels') {
    const st = q.get('st') || 'pending', ev = q.get('e') || '';
    const list = await rpc('vh_org_reels', { p_status: st, p_slug: ev || null });
    const vipIds = new Set(list.length ? await rpc('vh_vip_reel_ids', { p_ids: list.map(r => r.id) }, false).catch(() => []) : []);
    const chip = (k, l) => `<a class="btn sm ${st === k ? '' : 'ghost'}" href="#/org/reels?st=${k}${ev ? '&e=' + ev : ''}">${l}</a>`;
    body.innerHTML = `<div style="margin-top:12px">${chip('pending', '⏳ Pending')}${chip('approved', '✅ Live')}${chip('featured', '⭐ Picked')}${chip('rejected', '❌ Rejected')}</div>
      <select id="evf" style="margin-top:8px"><option value="">All events</option>${h.events.map(e => `<option value="${e.slug}" ${e.slug === ev ? 'selected' : ''}>${esc(e.name)}</option>`).join('')}</select>
      <details class="card sm"><summary><b>Moderation rules</b></summary><p class="mut" style="margin-top:6px">Approve only if the reel was filmed at this event, shows no nudity, violence, hate or drugs, doesn't mock or harass anyone, and isn't a repost of someone else's video. Pick ⭐ the best few for the official page and the aftermovie. Rejected reels never show to fans.</p></details>
      ${list.map(r => `<div class="card" data-id="${r.id}">
        <video src="${pub(r.video_path)}" controls playsinline preload="metadata" style="width:100%;max-height:60vh;border-radius:12px;background:#000"></video>
        <div style="margin-top:8px"><b>${esc(r.event)}</b> · <span class="pill v">⚡ ${r.score}</span> ${r.source === 'uploaded' ? '<span class="pill r">FROM GALLERY</span>' : '<span class="pill g">RECORDED LIVE</span>'} <span class="pill">${r.distance_m ?? '?'} m from venue</span></div>
        <div class="sm" style="margin-top:6px"><a href="#/u/${r.pid}">@${esc(r.creator)}</a> · ${esc(r.caption || '')}</div>
        <div class="mut sm">👁 ${r.views} · ❤️ ${r.likes} · 📤 ${r.shares} · 💬 ${r.comments} · ${ago(r.created_at)}</div>
        ${r.reject_reason ? `<div class="sm" style="color:#ff7a7a">Rejected: ${esc(r.reject_reason)}</div>` : ''}
        <div style="margin-top:8px">${st !== 'approved' ? '<button class="btn sm act" data-a="approved">✅ Approve</button>' : ''}${st !== 'featured' ? '<button class="btn sm g act" data-a="featured">⭐ Pick</button>' : ''}${st !== 'rejected' ? `<select class="rs" style="margin-top:6px"><option value="">Reject reason…</option><option>Not filmed at this event</option><option>Inappropriate content</option><option>Harassment or mocking someone</option><option>Repost / not their video</option><option>Low quality</option><option>Duplicate</option></select><button class="btn sm ghost act" data-a="rejected">${st === 'pending' ? '❌ Reject' : '🗑 Remove'}</button>` : ''}</div></div>`).join('') || `<p class="mut" style="margin-top:14px">${st === 'pending' ? 'All caught up. No reels waiting.' : 'Nothing here.'}</p>`}`;
    body.querySelectorAll('.vt').forEach(b => b.onclick = async () => { try { await rpc('vh_tag_reel_vip', { p_reel: b.closest('.card').dataset.id, p_on: b.dataset.on === '1' }); toast('Updated'); orgPortal(tab, q); } catch (e) { toast(e.message); } });
    $('#evf').onchange = e => location.hash = `#/org/reels?st=${st}${e.target.value ? '&e=' + e.target.value : ''}`;
    body.querySelectorAll('.act').forEach(b => b.onclick = async () => {
      const c = b.closest('.card'), a = b.dataset.a, reason = c.querySelector('.rs')?.value || null;
      if (a === 'rejected' && !reason) return toast('Choose a reason first');
      try { await rpc('vh_org_set_reel', { p_reel: c.dataset.id, p_status: a, p_reason: reason }); c.remove(); toast(a === 'rejected' ? 'Removed' : a === 'featured' ? 'Picked ⭐' : 'Approved ✅'); } catch (e) { toast(e.message); }
    });
    return;
  }

  const now = Date.now();
  body.innerHTML = `<h2>Your events</h2>` + (h.events.map(e => {
    const live = new Date(e.starts_at) <= now && new Date(e.ends_at) > now, over = new Date(e.ends_at) <= now;
    return `<div class="card" data-slug="${e.slug}"><b>${esc(e.name)}</b> ${live ? '<span class="pill g">LIVE</span>' : over ? '<span class="pill">ENDED</span>' : '<span class="pill c">UPCOMING</span>'}
      <div class="mut sm">${esc(e.venue || '')} · ${fmtD(e.starts_at)} → ${fmtD(e.ends_at)} · ${e.radius_m} m</div>
      <div class="mut sm">✅ ${e.checked_in} checked in · 🎬 ${e.reels} reels${e.pending ? ` · <b style="color:var(--gold)">${e.pending} to review</b>` : ''}</div>
      <a class="btn sm" href="#/screen/${e.slug}">📺 QR / venue screen</a>${e.pending ? `<a class="btn sm g" href="#/org/reels?st=pending&e=${e.slug}">Review ${e.pending}</a>` : ''}
      <a class="btn sm ghost" href="#/e/${e.slug}">Fan page</a>${over ? `<a class="btn sm ghost" href="#/movie/${e.slug}">🎬 Aftermovie</a>` : ''}
      <button class="btn sm line dash">📊 Dashboard</button><button class="btn sm ghost ed">✏️ Edit</button><button class="btn sm ghost vp">👑 VIP</button><div class="dbox"></div></div>`;
  }).join('') || '<div class="card center"><p class="mut">No events yet.</p><a class="btn" href="#/org/new">+ Create your first event</a></div>');
  body.querySelectorAll('.card[data-slug]').forEach(c => {
    const slug = c.dataset.slug, e = h.events.find(x => x.slug === slug), box = c.querySelector('.dbox');
    c.querySelector('.dash').onclick = () => { if (box.dataset.m === 'd') { box.innerHTML = ''; box.dataset.m = ''; return; } box.dataset.m = 'd'; eventDash(slug, box); };
    c.querySelector('.vp').onclick = async () => {
      if (box.dataset.m === 'v') { box.innerHTML = ''; box.dataset.m = ''; return; } box.dataset.m = 'v';
      let v = {}; try { v = await rpc('vh_org_get_vip', { p_slug: slug }); } catch (er) {}
      box.innerHTML = vipForm(v) + '<button class="btn sm vs">Save VIP</button>';
      const f = box.querySelector('.vipf'); bindVipForm(f);
      box.querySelector('.vs').onclick = async () => { try { await rpc('vh_org_set_vip', { p_slug: slug, p_cfg: readVip(f) }); toast('VIP saved ✅'); } catch (er) { toast(er.message); } };
    };
    c.querySelector('.ed').onclick = () => {
      if (box.dataset.m === 'e') { box.innerHTML = ''; box.dataset.m = ''; return; } box.dataset.m = 'e';
      box.innerHTML = `<div style="margin-top:10px"><label>Event name</label><input class="xn" value="${esc(e.name)}"><label>Venue</label><input class="xv" value="${esc(e.venue || '')}">
        <div class="row"><div><label>Starts</label><input class="xs" type="datetime-local" value="${locDT(new Date(e.starts_at))}"></div><div><label>Ends</label><input class="xe" type="datetime-local" value="${locDT(new Date(e.ends_at))}"></div></div>
        <label>Radius (m)</label><input class="xr" inputmode="numeric" value="${e.radius_m}"><button class="btn sm sv">Save changes</button></div>`;
      box.querySelector('.sv').onclick = async () => { try { await rpc('vh_org_update_event', { p_slug: slug, p_name: box.querySelector('.xn').value, p_venue: box.querySelector('.xv').value, p_radius: parseInt(box.querySelector('.xr').value), p_starts: new Date(box.querySelector('.xs').value).toISOString(), p_ends: new Date(box.querySelector('.xe').value).toISOString() }); toast('Saved ✅'); orgPortal('events', q); } catch (er) { toast(er.message); } };
    };
  });
}

// ---------- organiser dashboard (per event) ----------
async function eventDash(slug, box) {
  box.innerHTML = '<p class="mut sm" style="margin-top:8px">Loading…</p>';
  const [n, anns] = await Promise.all([rpc('vh_admin_event_stats', { p_slug: slug }), rpc('vh_announcements', { p_slug: slug }, false)]);
  const st = (v, l, c) => `<div class="stat"><b${c ? ` style="color:${c}"` : ''}>${v}</b><span>${l}</span></div>`;
  box.innerHTML = `<div style="margin-top:12px">
    <div class="row">${st(n.checked_in, 'Checked in')}${st(n.reels, 'Reels')}${st(n.creators, 'Creators')}</div>
    <div class="row" style="margin-top:8px">${st(n.views, 'Views')}${st(n.likes, 'Likes', 'var(--p)')}${st(n.shares, 'Shares', 'var(--c)')}</div>
    <div class="row" style="margin-top:8px">${st(n.live, 'Live')}${st(n.picked, 'Picked', 'var(--gold)')}</div>
    ${n.top ? `<div class="card reelrow" style="margin-top:10px"><video src="${pub(n.top.video_path)}#t=0.5" muted playsinline preload="metadata"></video><div><b>🏆 Top reel</b><div class="sm">@${esc(n.top.creator)}</div><div class="mut sm">${esc(n.top.caption || '')}</div><div class="pill v" style="margin-top:6px">⚡ ${n.top.score}</div></div></div>` : ''}
    <button class="btn sm ghost cps">📋 Copy numbers for sponsors</button>
    <h2 style="font-size:22px">📢 Live announcement</h2>
    <input class="an" maxlength="160" placeholder="Doors open now · DJ at 9 PM · Food court near the stage">
    <button class="btn sm send">Send to fans + venue screen</button>
    <div class="alist">${anns.map(a => `<div class="ann" data-id="${a.id}"><div>${esc(a.body)}</div><div class="mut">Organiser · ${ago(a.at)} · <a href="#" class="del" style="color:#ff7a7a">delete</a></div></div>`).join('')}</div></div>`;
  box.querySelector('.cps').onclick = () => {
    const txt = `VibeHai numbers\n✅ ${n.checked_in} fans checked in at the venue\n🎬 ${n.reels} reels from ${n.creators} creators\n👁 ${n.views} views · ❤️ ${n.likes} likes · 📤 ${n.shares} shares\n⭐ ${n.picked} reels picked for Instagram`;
    navigator.clipboard.writeText(txt).then(() => toast('Copied'), () => prompt('Copy', txt));
  };
  box.querySelector('.send').onclick = async () => { const v = box.querySelector('.an').value.trim(); if (!v) return toast('Write a message'); try { await rpc('vh_post_announcement', { p_slug: slug, p_body: v, p_token: null }); toast('Sent 📢'); eventDash(slug, box); } catch (e) { toast(e.message); } };
  box.querySelectorAll('.del').forEach(a => a.onclick = async ev => { ev.preventDefault(); try { await rpc('vh_delete_announcement', { p_id: a.closest('.ann').dataset.id }); a.closest('.ann').remove(); } catch (e) { toast(e.message); } });
}

// ---------- public scoring rules ----------
async function scorePage() {
  app.innerHTML = `<div class="wrap"><div class="top"><a href="#/" class="logo">⚡ VIBEHAI</a></div>
    <h1>How picks work</h1>
    <div class="card glow"><b>⚡ Every reel gets a score</b><p style="margin-top:8px;font-family:'Space Mono';font-size:13px">${SCORE_TXT}</p></div>
    <div class="row"><div class="stat"><b>×1</b><span>View</span></div><div class="stat"><b style="color:var(--p)">×2</b><span>Like</span></div><div class="stat"><b style="color:var(--c)">×5</b><span>Share</span></div></div>
    <div class="card"><b>The rules</b>
      <p class="sm" style="margin-top:6px">1. Only reels filmed at the venue during the event count. Location is checked at the QR and again at upload.</p>
      <p class="sm" style="margin-top:6px">2. The highest-scoring reels go to our team. We check quality and pick the best for Instagram.</p>
      <p class="sm" style="margin-top:6px">3. Picked reels get a cash payout to your UPI and credit on our Instagram.</p>
      <p class="sm" style="margin-top:6px">4. One like and one share counts per person. Fake views, bots or someone else's clip mean no payout.</p></div>
    <a class="btn" href="#/feed">▶ Watch reels</a></div>${nav('')}`;
}

// ---------- venue screen: static QR ----------
async function screen(slug) {
  const m = await me();
  try { await rpc('vh_admin_event_stats', { p_slug: slug }); } catch (e) { location.hash = m.is_admin ? '#/admin' : '#/org'; return; }
  const ev = await rpc('vh_event', { p_slug: slug }, false);
  app.innerHTML = `<div class="wrap center" style="padding-top:30px"><div class="logo" style="font-size:34px">⚡ VIBEHAI</div><h1 style="margin-top:8px">${esc(ev.name)}</h1>
    <p class="mut">Scan to post your reel. The best get paid 💸</p>
    <div class="qr" style="margin-top:18px;width:min(86vw,420px)"><div id="q"></div></div>
    <div id="sstat" class="sm" style="margin-top:12px;font-family:'Space Mono';color:var(--g)"></div>
    <div id="sann" style="max-width:420px;margin:10px auto 0;text-align:left"></div>
    <p style="margin-top:12px;font-size:20px;font-weight:700">📸 Follow @originalvibehai</p>
    <a class="btn" id="dl" style="max-width:260px;margin:16px auto 0">⬇ Download QR to print</a>
    <p class="mut sm" style="margin-top:12px">One QR for the whole event. Print it or show it on screen. Only fans at the venue during the event can post.</p>
    <a class="btn ghost" href="${m.is_admin ? '#/admin/events' : '#/org'}" style="max-width:260px;margin:20px auto 0">← Back</a></div>`;
  const url = `${BASE}#/e/${slug}`;
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  $('#q').innerHTML = qr.createImgTag(10, 0);
  $('#dl').href = qr.createDataURL(16, 4); $('#dl').download = `vibehai-${slug}-qr.gif`;
  const live = async () => { try { const [n, a] = await Promise.all([rpc('vh_admin_event_stats', { p_slug: slug }), rpc('vh_announcements', { p_slug: slug }, false)]);
    const s1 = $('#sstat'); if (s1) s1.textContent = `✅ ${n.checked_in} CHECKED IN · 🎬 ${n.reels} REELS`;
    const s2 = $('#sann'); if (s2) s2.innerHTML = a.length ? annHtml(a.slice(0, 1)) : ''; } catch (e) {} };
  live(); const lt = setInterval(live, 20000);
  let wl = null; try { wl = await navigator.wakeLock?.request('screen'); } catch (e) {}
  onLeave(() => { clearInterval(lt); wl?.release?.(); });
}

render();
</script>
</body>
</html>
